<style>
body{font-family:-apple-system,'Segoe UI',sans-serif;max-width:480px;margin:0 auto;padding:16px;background:#f2f4f7;color:#1c1c1e}
h1{font-size:20px;margin:8px 0 16px}
section{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
h2{font-size:16px;margin:0 0 8px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=password]{width:100%;box-sizing:border-box;padding:9px;font-size:15px;border:1px solid #c9ced6;border-radius:8px}
.results{border:1px solid #c9ced6;border-radius:8px;max-height:180px;overflow-y:auto;display:none;background:#fff;margin-top:2px}

.route{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eef0f3}
.route button{background:#d9534f;color:#fff;border:0;border-radius:6px;padding:6px 10px;font-size:13px}

.muted{color:#7c828c;font-size:12px;margin:6px 0 0}
.err{color:#c22;font-size:13px;min-height:16px;margin:4px 0 0}

  <div class="results" id="toResults"></div>
  <p class="err" id="addErr"></p>
  <button class="primary" id="add">➕ Route toevoegen</button>

}

function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

function getQueryParam(name, def){
  var m = location.search.match(new RegExp('[?&]' + name + '=([^&]+)'));
  return m ? decodeURIComponent(m[1]) : def;
}

// Pre-fill via ?data= (index.js stuurt je huidige config mee)
var cfg = loadInitial();
var routes = (cfg.routes || []).slice(0, 5);
function loadInitial(){
  try {
    var m = location.search.match(/[?&]data=([^&]+)/);
    if (m) return JSON.parse(decodeURIComponent(m[1]));
  } catch (e) {}
  return { apiKey: '', routes: [] };
}

var keyEl = document.getElementById('key');
keyEl.value = cfg.apiKey || '';
document.getElementById('showkey').onchange = function(){ keyEl.type = this.checked ? 'text' : 'password'; };

function renderRoutes(){
  var box = document.getElementById('routes');
  box.innerHTML = '';
  if (!routes.length) {
    box.innerHTML = '<p class="muted" style="margin:0">Nog geen routes. Voeg hieronder je eerste toe.</p>';
    return;
  }
  routes.forEach(function(r, i){
    var row = document.createElement('div'); row.className = 'route';
    var s = document.createElement('span'); s.textContent = r.label;
    var b = document.createElement('button'); b.textContent = 'Verwijder';
    b.onclick = function(){ routes.splice(i, 1); renderRoutes(); };
    row.appendChild(s); row.appendChild(b); box.appendChild(row);
  });
}
renderRoutes();

// Station-zoeker (accent-loos: 'Feanwâlden' vindt je met 'feanwalden')
function makePicker(inputId, resultsId){
  var input = document.getElementById(inputId);
  var box = document.getElementById(resultsId);
  var chosen = null;
  input.addEventListener('input', function(){
    chosen = null;
    var q = norm(input.value);
    if (q.length < 2) { box.style.display = 'none'; return; }
    var hits = STATIONS.filter(function(s){
      return norm(s.n).indexOf(q) !== -1 || s.c.indexOf(q) === 0;
    }).slice(0, 8);
    box.innerHTML = '';
    hits.forEach(function(s){
      var d = document.createElement('div');
      d.textContent = s.n + '  (' + s.c.toUpperCase() + ')';
      d.onclick = function(){ chosen = s; input.value = s.n; box.style.display = 'none'; };
      box.appendChild(d);
    });
    box.style.display = hits.length ? 'block' : 'none';
  });
  return {
    get: function(){ return chosen; },
    reset: function(){ chosen = null; input.value = ''; box.style.display = 'none'; }
  };
}
var fromP = makePicker('from', 'fromResults');
var toP   = makePicker('to',   'toResults');

// Route toevoegen (met validatie)
document.getElementById('add').onclick = function(){
  var err = document.getElementById('addErr');
  var f = fromP.get(), t = toP.get();
  if (!f || !t) { err.textContent = 'Kies eerst een station bij Van en Naar uit de lijst.'; return; }
  if (f.c === t.c) { err.textContent = 'Van en Naar mogen niet hetzelfde station zijn.'; return; }
  if (routes.length >= 5) { err.textContent = 'Maximum van 5 routes bereikt.'; return; }
  if (routes.some(function(r){ return r.from === f.c && r.to === t.c; })) { err.textContent = 'Deze route bestaat al.'; return; }
  err.textContent = '';
  routes.push({ from: f.c, to: t.c, label: f.n + ' → ' + t.n });
  renderRoutes();
  fromP.reset(); toP.reset();
};

// Opslaan — officieel return-schema: pebblejs://close#<encoded JSON>
var return_to   = getQueryParam('return_to', 'pebblejs://close#');
var fromPebble  = getQueryParam('from', '') === 'pebble'; // door index.js gezet
document.getElementById('save').onclick = function(){
  var json = JSON.stringify({ apiKey: keyEl.value.trim(), routes: routes });
  if (fromPebble) {
    document.location = return_to + encodeURIComponent(json);
  } else {
    // Geopend in een gewone browser (desktop-test): laat de payload zien
    document.getElementById('msg').textContent = 'Test buiten Pebble – dit wordt de payload: ' + json;
  }
};
